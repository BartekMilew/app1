<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Origin A — host</title>
    <style>
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #f4f5f7; color: #14161a; }
      .wrap { padding: 20px; max-width: 860px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { color: #5b6273; margin: 0 0 14px; }
      input { width: 100%; padding: 9px 12px; border: 1px solid #cbd0da; border-radius: 8px; font: inherit; box-sizing: border-box; }
      button { margin-top: 10px; padding: 9px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      iframe { margin-top: 18px; width: 100%; height: 640px; border: 1px solid #cbd0da; border-radius: 10px; background: #fff; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Origin A — strona hosta</h1>
      <p>Origin tej strony: <code id="origin"></code>. Wklej URL aplikacji z origin B i załaduj iframe.</p>
      <input id="url" value="https://bartekmilew.github.io/app1/" />
      <button id="load">Załaduj iframe</button>
      <iframe id="frame" allow="publickey-credentials-get *; publickey-credentials-create *"></iframe>
    </div>
    <script>
      document.getElementById('origin').textContent = location.origin;
      var frame = document.getElementById('frame');
      var input = document.getElementById('url');
      function load() { frame.src = input.value; }
      document.getElementById('load').addEventListener('click', load);
      load();
    </script>
  </body>
</html>
